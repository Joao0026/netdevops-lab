name: netdevops-lab

topology:
  nodes:
    # --- Routers (FRRouting - fully open source, no licensing needed) ---
    r1:
      kind: linux
      image: frrouting/frr:latest
      binds:
        - configs/r1/daemons:/etc/frr/daemons
        - configs/r1/frr.conf:/etc/frr/frr.conf
        - configs/r1/vtysh.conf:/etc/frr/vtysh.conf
      cap-add:
        - NET_ADMIN
        - NET_RAW
        - SYS_ADMIN

    r2:
      kind: linux
      image: frrouting/frr:latest
      binds:
        - configs/r2/daemons:/etc/frr/daemons
        - configs/r2/frr.conf:/etc/frr/frr.conf
        - configs/r2/vtysh.conf:/etc/frr/vtysh.conf
      cap-add:
        - NET_ADMIN
        - NET_RAW
        - SYS_ADMIN

    r3:
      kind: linux
      image: frrouting/frr:latest
      binds:
        - configs/r3/daemons:/etc/frr/daemons
        - configs/r3/frr.conf:/etc/frr/frr.conf
        - configs/r3/vtysh.conf:/etc/frr/vtysh.conf
      cap-add:
        - NET_ADMIN
        - NET_RAW
        - SYS_ADMIN

    # --- End hosts for connectivity testing ---
    pc1:
      kind: linux
      image: wbitt/network-multitool:alpine-extra
      exec:
        - ip addr add 192.168.1.10/24 dev eth1
        - ip route replace default via 192.168.1.1

    pc3:
      kind: linux
      image: wbitt/network-multitool:alpine-extra
      exec:
        - ip addr add 192.168.3.10/24 dev eth1
        - ip route replace default via 192.168.3.1

  # --- Links: r1-r2-r3 in a triangle so OSPF has a redundant path ---
  links:
    - endpoints: ["r1:eth1", "r2:eth1"]   # 10.0.12.0/30
    - endpoints: ["r2:eth2", "r3:eth1"]   # 10.0.23.0/30
    - endpoints: ["r1:eth2", "r3:eth2"]   # 10.0.13.0/30 (redundant link)
    - endpoints: ["r1:eth3", "pc1:eth1"]  # 192.168.1.0/24
    - endpoints: ["r3:eth3", "pc3:eth1"]  # 192.168.3.0/24
